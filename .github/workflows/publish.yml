name: Publish to crates.io

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Verify tag version matches Cargo.toml
        run: |
          TAG_VERSION=${GITHUB_REF#refs/tags/v}
          CARGO_VERSION=$(grep '^version' crates/refgraph-core/Cargo.toml | head -1 | sed 's/.*= "\(.*\)"/\1/')
          if [ "$TAG_VERSION" != "$CARGO_VERSION" ]; then
            echo "Tag version $TAG_VERSION does not match Cargo.toml version $CARGO_VERSION"
            exit 1
          fi

      - name: Publish refgraph-core
        run: cargo publish -p refgraph-core --token ${{ secrets.CARGO_TOKEN }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_TOKEN }}

      - name: Wait for refgraph-core to be available
        run: sleep 10

      - name: Publish refgraph-neo4j
        run: cargo publish -p refgraph-neo4j --token ${{ secrets.CARGO_TOKEN }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_TOKEN }}

      - name: Wait for refgraph-neo4j to be available
        run: sleep 10

      - name: Publish refgraph-domains
        run: cargo publish -p refgraph-domains --token ${{ secrets.CARGO_TOKEN }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_TOKEN }}

      - name: Create Release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref }}
          release_name: RefGraph ${{ github.ref }}
          body: |
            Crates published:
            - refgraph-core v${{ github.ref }}
            - refgraph-neo4j v${{ github.ref }}
            - refgraph-domains v${{ github.ref }}

            See [CHANGELOG.md](CHANGELOG.md) for details.
          draft: false
          prerelease: false
